services:
  vpn:
    image: tailscale/tailscale:latest
    container_name: vpn
    hostname: vpn
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS}
      - TS_STATE_DIR=/var/lib/tailscale
      # Kernel mode: creates a real tun interface so traffic from every container
      # sharing this network namespace is actually routed via the exit node.
      # (Userspace mode only proxies inbound tailnet traffic; outbound leaked.)
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:9002
      # Host uses nftables; the image's legacy iptables can't see the filter table
      - TS_DEBUG_FIREWALL_MODE=nftables
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./data/tailscale/state:/var/lib/tailscale
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: on-failure

  downloader:
    container_name: downloader
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      - PGID=1001
      - PUID=1000
      - QBT_LEGAL_NOTICE=confirm
      - QBT_VERSION=5.1.0-1
      - QBT_WEBUI_PORT=8080
      - TZ=Asia/Kolkata
    image: qbittorrentofficial/qbittorrent-nox:latest
    #ports:
    #  - 6881:6881/tcp
    #  - 6881:6881/udp
    #  - 8080:8080/tcp
    read_only: true
    stop_grace_period: 30m
    tmpfs:
      - /tmp
    tty: true
    volumes:
      - ./data/downloader:/config
      - /media/downloads:/downloads
    restart: on-failure
    network_mode: service:vpn

  radarr:
    depends_on:
      vpn:
        condition: service_healthy
      downloader:
        condition: service_started
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1001
      - TZ=Asia/Kolkata
    volumes:
      - ./data/radarr:/config
      - /media/movies:/movies
      - /media/downloads:/downloads
      - /media/backup/radarr:/config/Backups
    #ports:
    #  - 7878:7878
    restart: on-failure
    network_mode: service:vpn

  sonarr:
    depends_on:
      vpn:
        condition: service_healthy
      downloader:
        condition: service_started
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1001
      - TZ=Asia/Kolkata
    volumes:
      - ./data/sonarr:/config
      - /media/anime:/series
      - /media/downloads:/downloads
      - /media/backup/sonarr:/config/Backups
    #ports:
    #  - 8989:8989
    restart: on-failure
    network_mode: service:vpn
