services:
  vpn:
    image: tailscale/tailscale:latest
    container_name: vpn
    hostname: vpn
    env_file: ../common.env
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS}
      - TS_STATE_DIR=/var/lib/tailscale
      # Kernel mode: creates a real tun interface so traffic from every container
      # sharing this network namespace is actually routed via the exit node.
      # (Userspace mode only proxies inbound tailnet traffic; outbound leaked.)
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:9002
      # Host uses nftables; the image's legacy iptables can't see the filter table
      - TS_DEBUG_FIREWALL_MODE=nftables
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/tailscale/state:/var/lib/tailscale
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: on-failure

  downloader:
    image: qbittorrentofficial/qbittorrent-nox:latest
    container_name: downloader
    depends_on:
      vpn:
        condition: service_healthy
    env_file: ../common.env
    environment:
      - QBT_LEGAL_NOTICE=confirm
      - QBT_WEBUI_PORT=8080
    read_only: true
    stop_grace_period: 30m
    tmpfs:
      - /tmp
    tty: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/downloader:/config
      # qbit keeps /downloads; radarr/sonarr map it via a Remote Path Mapping
      - /media/data/downloads:/downloads
    # No ports: reachable only over the tailnet through the vpn container
    network_mode: service:vpn
    restart: on-failure

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    depends_on:
      vpn:
        condition: service_healthy
      downloader:
        condition: service_started
    env_file: ../common.env
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/radarr:/config
      # Single mount so imports can hardlink from downloads into the library
      - /media/data:/data
      - /media/backup/radarr:/config/Backups
    network_mode: service:vpn
    restart: on-failure

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    depends_on:
      vpn:
        condition: service_healthy
      downloader:
        condition: service_started
    env_file: ../common.env
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/sonarr:/config
      # Single mount so imports can hardlink from downloads into the library
      - /media/data:/data
      - /media/backup/sonarr:/config/Backups
    network_mode: service:vpn
    restart: on-failure
