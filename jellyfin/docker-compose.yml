services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    env_file: ../common.env
    group_add:
      - 983 # host "video" group  – /dev/dri access for HW transcoding
      - 987 # host "render" group
    devices:
      - /dev/dri:/dev/dri
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/config:/config
      - ./data/cache:/cache
      - /media/data/anime:/anime
      - /media/data/movies:/movies
    ports:
      - 8096:8096
    restart: on-failure
